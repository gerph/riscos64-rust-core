name: Build Rust Core Payload

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: gerph/riscos-build:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install host build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y build-essential \
                             rustup

      - name: Build packaged Rust core payload
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build-core.sh

      - name: Validate payload by linking and running a 64-bit AIF
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/validate-link.sh

      - name: Upload payload archive
        uses: actions/upload-artifact@v4
        with:
          name: riscos64-rust-core-payload
          path: build/dist/*.zip

