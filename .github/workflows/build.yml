name: Build Rust Payload

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: gerph/riscos-build:latest-64bit
    strategy:
      fail-fast: false
      matrix:
        profile:
          - alloc
          - core
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install host build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y build-essential

      - name: Set artifact version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(git rev-parse --short HEAD)"
          fi

          if [[ "${{ matrix.profile }}" == "alloc" ]]; then
            archive_name="RISCOS64-RustCore-${version}.zip"
          else
            archive_name="RISCOS64-RustCore-coreonly-${version}.zip"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "archive_name=${archive_name}" >> "$GITHUB_OUTPUT"

      - name: Build packaged Rust payload
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build-payload.sh --profile "${{ matrix.profile }}"

      - name: Validate payload by linking and running a 64-bit AIF
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/validate-payload.sh --profile "${{ matrix.profile }}"

      - name: Give the output a versioned name
        shell: bash
        run: |
          set -euo pipefail
          archive_path="$(find build/dist -maxdepth 1 -type f -name "riscos64-rust-core-${{ matrix.profile }}-*.zip" | head -n 1)"
          mv "$archive_path" "build/dist/${{ steps.version.outputs.archive_name }}"

      - name: Upload payload archive
        uses: actions/upload-artifact@v4
        with:
          name: riscos64-rust-core-${{ matrix.profile }}-${{ steps.version.outputs.version }}
          path: build/dist/${{ steps.version.outputs.archive_name }}

  release:
    runs-on: ubuntu-latest
    needs:
      - build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Set release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download alloc payload archive
        uses: actions/download-artifact@v4
        with:
          name: riscos64-rust-core-alloc-${{ steps.version.outputs.version }}
          path: release-artifacts

      - name: Download core-only payload archive
        uses: actions/download-artifact@v4
        with:
          name: riscos64-rust-core-core-${{ steps.version.outputs.version }}
          path: release-artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            release-artifacts/RISCOS64-RustCore-${{ steps.version.outputs.version }}.zip
            release-artifacts/RISCOS64-RustCore-coreonly-${{ steps.version.outputs.version }}.zip
