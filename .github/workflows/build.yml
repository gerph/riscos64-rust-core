name: Build Rust Core Payload

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: gerph/riscos-build:latest-64bit
    outputs:
      version: ${{ steps.version.outputs.version }}
      archive_name: ${{ steps.version.outputs.archive_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install host build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y build-essential

      - name: Build packaged Rust core payload
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build-core.sh

      - name: Validate payload by linking and running a 64-bit AIF
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/validate-link.sh

      - name: Give the output a versioned name
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(git rev-parse --short HEAD)"
          fi

          archive_name="RISCOS64-RustCore-${version}.zip"
          mv build/dist/*.zip "build/dist/${archive_name}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "archive_name=${archive_name}" >> "$GITHUB_OUTPUT"

      - name: Upload payload archive
        uses: actions/upload-artifact@v4
        with:
          name: riscos64-rust-core-payload
          path: build/dist/${{ steps.version.outputs.archive_name }}

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download payload archive
        uses: actions/download-artifact@v4
        with:
          name: riscos64-rust-core-payload

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ needs.build.outputs.archive_name }}
